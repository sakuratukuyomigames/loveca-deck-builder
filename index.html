
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ラブカ デッキビルダー</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f5f6fa;
      color: #222;
    }
    header {
      background: #ec4899;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }
    main {
      padding: 16px;
      max-width: 900px;
      margin: auto;
    }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }
    #status {
      margin: 16px 0;
      color: #666;
    }
    #cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 12px;
      overflow-wrap: anywhere;
      box-shadow: 0 2px 6px #00000012;
    }
    .number {
      color: #888;
      font-size: 12px;
    }
    .name {
      font-weight: bold;
      margin-top: 6px;
    }
    .details {
      margin-top: 8px;
      font-size: 13px;
      color: #555;
    }
  </style>
</head>
<body>
  <header>ラブカ デッキビルダー</header>
  <main>
    <input id="search" placeholder="カード名・カード番号で検索">
    <div id="status">カードデータの接続設定待ち</div>
    <div id="cards"></div>
  </main>

  <script>
    const SUPABASE_URL = "";
    const SUPABASE_ANON_KEY = "";

    let allCards = [];

    function renderCards() {
      const keyword = document.getElementById("search")
        .value.trim().toLowerCase();

      const filtered = allCards.filter(card =>
        String(card.name || "").toLowerCase().includes(keyword) ||
        String(card.card_number || "").toLowerCase().includes(keyword)
      );

      document.getElementById("status").textContent =
        `${filtered.length}枚のカード`;

      const container = document.getElementById("cards");
      container.replaceChildren();

      for (const card of filtered.slice(0, 100)) {
        const element = document.createElement("div");
        element.className = "card";

        const number = document.createElement("div");
        number.className = "number";
        number.textContent = card.card_number || "";

        const name = document.createElement("div");
        name.className = "name";
        name.textContent = card.name || "名称不明";

        const details = document.createElement("div");
        details.className = "details";
        details.textContent =
          `コスト: ${card.cost ?? "-"} / レアリティ: ${card.rarity || "-"}`;

        element.append(number, name, details);
        container.append(element);
      }
    }

    async function loadCards() {
      if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
        return;
      }

      try {
        document.getElementById("status").textContent =
          "カードを読み込み中...";

        let offset = 0;
        const pageSize = 1000;

        while (true) {
          const response = await fetch(
            `${SUPABASE_URL}/rest/v1/cards?select=card_number,name,cost,rarity&order=id.asc&limit=${pageSize}&offset=${offset}`,
            {
              headers: {
                apikey: SUPABASE_ANON_KEY,
                Authorization: `Bearer ${SUPABASE_ANON_KEY}`
              }
            }
          );

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const page = await response.json();
          allCards.push(...page);

          if (page.length < pageSize) break;
          offset += pageSize;
        }

        renderCards();
      } catch (error) {
        document.getElementById("status").textContent =
          "読み込みエラー: " + error.message;
      }
    }

    document.getElementById("search")
      .addEventListener("input", renderCards);

    loadCards();
  </script>
</body>
</html>
