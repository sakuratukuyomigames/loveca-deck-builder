
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ラブカ デッキビルダー</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f5f6fa;
      color: #222;
    }
    header {
      background: #ec4899;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }
    main {
      padding: 16px;
      max-width: 900px;
      margin: auto;
    }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }
    #status {
      margin: 16px 0;
      color: #666;
    }
    #cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 12px;
      overflow-wrap: anywhere;
      box-shadow: 0 2px 6px #00000012;
    }
    .number {
      color: #888;
      font-size: 12px;
    }
    .name {
      font-weight: bold;
      margin-top: 6px;
    }
    .details {
      margin-top: 8px;
      font-size: 13px;
      color: #555;
    }
  </style>
</head>
<body>
  <header>ラブカ デッキビルダー</header>
  <main>
    
<section id="deck-section">
  <h2>現在のデッキ（0枚）</h2>
  <div id="deck-list"></div>
</section>
<hr>

    <input id="search" placeholder="カード名・カード番号で検索">
    <div id="status">カードデータの接続設定待ち</div>
    <div id="cards"></div>
  </main>

  <script>
    const SUPABASE_URL = "https://gsukwasgetofxdiysdsu.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_CNjmZrO04cmLcyHjzW8XmQ_eM-Bs1xv";

    let allCards = [];
let deck = [];

function addToDeck(card) {
  const count = deck.filter(
    c => c.card_number === card.card_number
  ).length;

  if (count >= 4) {
    alert("同じカードは4枚までです");
    return;
  }

  
deck.push(card);
renderDeck();
}

function renderDeck() {
  const list = document.getElementById("deck-list");
  const title = document.querySelector("#deck-section h2");

  title.textContent = `現在のデッキ（${deck.length}枚）`;
  list.replaceChildren();

  const counts = new Map();

  for (const card of deck) {
    const key = card.card_number;
    if (!counts.has(key)) {
      counts.set(key, { card, count: 0 });
    }
    counts.get(key).count++;
  }

  for (const { card, count } of counts.values()) {
    const item = document.createElement("div");
    
const image = document.createElement("img");
image.src = "https://llofficial-cardgame.com/wordpress/wp-content/images/cardlist/" + (card.image_url || "").trim();
image.alt = card.name || "カード画像";
image.style.width = "100px";
image.style.height = "auto";
image.style.display = "block";
image.style.borderRadius = "6px";
image.style.marginBottom = "6px";

item.append(image);
item.append(document.createTextNode(`${card.name} × ${count}枚 `));
item.style.padding = "8px 0";

const removeButton = document.createElement("button");
removeButton.textContent = "− 1枚";
removeButton.style.marginLeft = "12px";
removeButton.style.padding = "6px 12px";

removeButton.addEventListener("click", () => {
  const index = deck.findIndex(
    c => c.card_number === card.card_number
  );

  if (index !== -1) {
    deck.splice(index, 1);
    renderDeck();
  }
});

item.append(removeButton);
list.append(item);

  }
}

    function renderCards() {
      const keyword = document.getElementById("search")
        .value.trim().toLowerCase();

      const filtered = allCards.filter(card =>
        String(card.name || "").toLowerCase().includes(keyword) ||
        String(card.card_number || "").toLowerCase().includes(keyword)
      );

      document.getElementById("status").textContent =
        `${filtered.length}枚のカード`;

      const container = document.getElementById("cards");
      container.replaceChildren();

      for (const card of filtered.slice(0, 100)) {
        const element = document.createElement("div");
        element.className = "card";
element.addEventListener("click", () => {
  addToDeck(card);
});
        const number = document.createElement("div");
        number.className = "number";
        number.textContent = card.card_number || "";

        const name = document.createElement("div");
        name.className = "name";
        name.textContent = card.name || "名称不明";

        const details = document.createElement("div");
        details.className = "details";
        details.textContent =
          `コスト: ${card.cost ?? "-"} / レアリティ: ${card.rarity || "-"}`;

        const image = document.createElement("img");
        image.src = "https://llofficial-cardgame.com/wordpress/wp-content/images/cardlist/" + (card.image_url || "").trim();
        image.alt = card.name || "カード画像";
        image.style.width = "100%";
        image.style.height = "auto";
        image.style.borderRadius = "8px";
        image.style.display = "block";
        image.style.marginBottom = "8px";

        element.append(image, number, name, details);
        container.append(element);
      }
    }

    async function loadCards() {
      if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
        return;
      }

      try {
        document.getElementById("status").textContent =
          "カードを読み込み中...";

        let offset = 0;
        const pageSize = 1000;

        while (true) {
          const response = await fetch(
            `${SUPABASE_URL}/rest/v1/cards?select=card_number,name,cost,rarity,image_url&order=id.asc&limit=${pageSize}&offset=${offset}`,
            {
              headers: {
                apikey: SUPABASE_ANON_KEY,
                Authorization: `Bearer ${SUPABASE_ANON_KEY}`
              }
            }
          );

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const page = await response.json();
          allCards.push(...page);

          if (page.length < pageSize) break;
          offset += pageSize;
        }

        renderCards();
      } catch (error) {
        document.getElementById("status").textContent =
          "読み込みエラー: " + error.message;
      }
    }

    document.getElementById("search")
      .addEventListener("input", renderCards);

    loadCards();
  </script>
</body>
</html>
