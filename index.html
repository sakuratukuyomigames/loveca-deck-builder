
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ラブカ デッキビルダー</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f5f6fa;
      color: #222;
    }
    header {
      background: #ec4899;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }
    main {
      padding: 16px;
      max-width: 900px;
      margin: auto;
    }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }
    #status {
      margin: 16px 0;
      color: #666;
    }
    #cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 12px;
      overflow-wrap: anywhere;
      box-shadow: 0 2px 6px #00000012;
    }
    .number {
      color: #888;
      font-size: 12px;
    }
    .name {
      font-weight: bold;
      margin-top: 6px;
    }
    .details {
      margin-top: 8px;
      font-size: 13px;
      color: #555;
    }
  </style>
</head>
<body>
  <header>ラブカ デッキビルダー</header>
  <main>
    
<div style="margin: 16px 0;">
  <input
    id="deck-name"
    type="text"
    placeholder="デッキ名を入力（例：μ's 4TK）"
  >
</div>

<div style="margin: 12px 0;">
  <button id="save-named-deck">デッキを保存</button>
  <button id="new-deck">新規デッキ</button>
  <select id="saved-decks">
    <option value="">保存したデッキを選択</option>
  </select>
  <button id="load-named-deck">読み込む</button>
  <button id="delete-named-deck">デッキを削除</button>
  <button id="duplicate-deck">デッキを複製</button>
  </div>

<section id="deck-section">
  <h2>現在のデッキ（0枚）</h2>
  <div id="deck-list"></div>
</section>
<hr>

<select id="cost-filter">
  <option value="">すべてのコスト</option>
  <option value="0">0コスト</option>
  <option value="1">1コスト</option>
  <option value="2">2コスト</option>
  <option value="3">3コスト</option>
  <option value="4">4コスト</option>
  <option value="5">5コスト</option>
  <option value="6">6コスト</option>
  <option value="7">7コスト</option>
  <option value="8">8コスト</option>
  <option value="9">9コスト</option>
  <option value="10">10コスト</option>
  <option value="11">11コスト</option>
  <option value="12">12コスト</option>
  <option value="13">13コスト</option>
  <option value="14">14コスト</option>
  <option value="15">15コスト</option>
  <option value="16">16コスト</option>
  <option value="17">17コスト</option>
  <option value="18">18コスト</option>
  <option value="19">19コスト</option>
  <option value="20">20コスト</option>
</select>

<select id="blade-filter">
  <option value="">すべてのブレード</option>
  <option value="0">0ブレード</option>
  <option value="1">1ブレード</option>
  <option value="2">2ブレード</option>
  <option value="3">3ブレード</option>
  <option value="4">4ブレード</option>
  <option value="5">5ブレード</option>
  <option value="6">6ブレード</option>
  <option value="7">7ブレード</option>
  <option value="8">8ブレード</option>
  <option value="9">9ブレード</option>
  <option value="10">10ブレード</option>
</select>

<select id="heart-filter">
  <option value="">すべてのハート</option>
  <option value="赤">赤ハート</option>
  <option value="黄">黄ハート</option>
  <option value="緑">緑ハート</option>
  <option value="青">青ハート</option>
  <option value="紫">紫ハート</option>
  <option value="桃">桃ハート</option>
  <option value="ALL">ALLハート</option>
</select>

<select id="heart-count-filter">
  <option value="1">1個以上</option>
  <option value="2">2個以上</option>
  <option value="3">3個以上</option>
  <option value="4">4個以上</option>
  <option value="5">5個以上</option>
  <option value="6">6個以上</option>
</select>

    <input id="search" placeholder="カード名・カード番号で検索">
    <div id="status">カードデータの接続設定待ち</div>
    <div id="cards"></div>
  </main>

  <script>
    const SUPABASE_URL = "https://gsukwasgetofxdiysdsu.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_CNjmZrO04cmLcyHjzW8XmQ_eM-Bs1xv";

    let allCards = [];
let deck = [];

function saveDeck() {
  localStorage.setItem(
    "loveca-deck",
    JSON.stringify(deck)
  );
}

function loadDeck() {
  try {
    const saved = localStorage.getItem("loveca-deck");
    deck = saved ? JSON.parse(saved) : [];
  } catch (error) {
    deck = [];
  }
}

function addToDeck(card) {
  const count = deck.filter(
    c => c.card_number === card.card_number
  ).length;

  if (count >= 4) {
    alert("同じカードは4枚までです");
    return;
  }

  
deck.push(card);
saveDeck();
renderDeck();
}

function renderDeck() {
  const list = document.getElementById("deck-list");
  const title = document.querySelector("#deck-section h2");

  title.textContent = `現在のデッキ（${deck.length}枚）`;
  list.replaceChildren();

  const counts = new Map();

  for (const card of deck) {
    const key = card.card_number;
    if (!counts.has(key)) {
      counts.set(key, { card, count: 0 });
    }
    counts.get(key).count++;
  }

  for (const { card, count } of counts.values()) {
    const item = document.createElement("div");
    
const image = document.createElement("img");
image.src = "https://llofficial-cardgame.com/wordpress/wp-content/images/cardlist/" + (card.image_url || "").trim();
image.alt = card.name || "カード画像";
image.style.width = "100px";
image.style.height = "auto";
image.style.display = "block";
image.style.borderRadius = "6px";
image.style.marginBottom = "6px";

item.append(image);
item.append(document.createTextNode(`${card.name} × ${count}枚 `));
item.style.padding = "8px 0";

const removeButton = document.createElement("button");
removeButton.textContent = "− 1枚";
removeButton.style.marginLeft = "12px";
removeButton.style.padding = "6px 12px";

removeButton.addEventListener("click", () => {
  const index = deck.findIndex(
    c => c.card_number === card.card_number
  );

  if (index !== -1) {
    deck.splice(index, 1);
    saveDeck();
    renderDeck();
  }
});

item.append(removeButton);
list.append(item);

  }
}

    function renderCards() {
      const keyword = document.getElementById("search")
  .value.trim().toLowerCase();
      
const selectedCost = document.getElementById("cost-filter").value;

const selectedBlade = document.getElementById("blade-filter").value;

 const selectedHeart =
  document.getElementById("heart-filter").value;
  
const selectedHeartCount =
  Number(document.getElementById("heart-count-filter").value);

const filtered = allCards.filter(card => {
  const matchesKeyword =
    String(card.name || "").toLowerCase().includes(keyword) ||
    String(card.card_number || "").toLowerCase().includes(keyword);

  const matchesCost =
    selectedCost === "" ||
    (card.cost !== null &&
      card.cost !== undefined &&
      card.cost !== "" &&
      Number(card.cost) === Number(selectedCost));

  const matchesBlade =
  selectedBlade === "" ||
  (card.blade !== null &&
    card.blade !== undefined &&
    card.blade !== "" &&
    Number(card.blade) === Number(selectedBlade));

const matchesHeart = (() => {
  if (selectedHeart === "") return true;

  const raw = String(card.hearts?.raw || "");
  const pattern = new RegExp(
    selectedHeart === "ALL" ? "ALL(\\d*)" : selectedHeart + "(\\d*)",
    "g"
  );

  let count = 0;
  for (const match of raw.matchAll(pattern)) {
    count += match[1] === "" ? 1 : Number(match[1]);
  }

  return count >= selectedHeartCount;
})();

  
return matchesKeyword && matchesCost && matchesBlade && matchesHeart;
});


      document.getElementById("status").textContent =
        `${filtered.length}枚のカード`;

      const container = document.getElementById("cards");
      container.replaceChildren();

      for (const card of filtered.slice(0, 100)) {
        const element = document.createElement("div");
        element.className = "card";
element.addEventListener("click", () => {
  addToDeck(card);
});
        const number = document.createElement("div");
        number.className = "number";
        number.textContent = card.card_number || "";

        const name = document.createElement("div");
        name.className = "name";
        name.textContent = card.name || "名称不明";

        const details = document.createElement("div");
        details.className = "details";
        details.textContent =
          `コスト: ${card.cost ?? "-"} / レアリティ: ${card.rarity || "-"}`;

        const image = document.createElement("img");
        image.src = "https://llofficial-cardgame.com/wordpress/wp-content/images/cardlist/" + (card.image_url || "").trim();
        image.alt = card.name || "カード画像";
        image.style.width = "100%";
        image.style.height = "auto";
        image.style.borderRadius = "8px";
        image.style.display = "block";
        image.style.marginBottom = "8px";

        element.append(image, number, name, details);
        container.append(element);
      }
    }

    async function loadCards() {
      if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
        return;
      }

      try {
        document.getElementById("status").textContent =
          "カードを読み込み中...";

        let offset = 0;
        const pageSize = 1000;

        while (true) {
          const response = await fetch(
  `${SUPABASE_URL}/rest/v1/cards?select=card_number,name,cost,rarity,image_url,blade,hearts&order=id.asc&limit=${pageSize}&offset=${offset}`,
  {
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`
    }
  }
);

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const page = await response.json();
          allCards.push(...page);

          if (page.length < pageSize) break;
          offset += pageSize;
        }

        renderCards();
      } catch (error) {
        document.getElementById("status").textContent =
        document.getElementById("cost-filter").addEventListener("change", renderCards);

          "読み込みエラー: " + error.message;
      }
    }

    document.getElementById("search")
      .addEventListener("input", renderCards);
    
document.getElementById("cost-filter").addEventListener("change", renderCards);

document.getElementById("blade-filter")
  .addEventListener("change", renderCards);
document.getElementById("heart-filter")
  .addEventListener("change", renderCards);
    loadDeck();
    renderDeck();
    
const deckNameInput = document.getElementById("deck-name");

deckNameInput.value =
  localStorage.getItem("loveca-deck-name") || "";

function getNamedDecks() {
  try {
    return JSON.parse(
      localStorage.getItem("loveca-named-decks") || "{}"
    );
  } catch {
    return {};
  }
}

function refreshSavedDecks() {
  const select = document.getElementById("saved-decks");
  select.replaceChildren(new Option("保存したデッキを選択", ""));

  for (const name of Object.keys(getNamedDecks())) {
    select.add(new Option(name, name));
  }
}

document.getElementById("save-named-deck").addEventListener("click", () => {
  const name = deckNameInput.value.trim();

  if (!name) {
    alert("デッキ名を入力してください");
    return;
  }

  const decks = getNamedDecks();

  if (decks[name] && !confirm("同名デッキを上書きしますか？")) {
    return;
  }

  decks[name] = deck;
  localStorage.setItem("loveca-named-decks", JSON.stringify(decks));
  refreshSavedDecks();
  document.getElementById("saved-decks").value = name;
  alert("デッキを保存しました");
});

document.getElementById("new-deck").addEventListener("click", () => {
  if (!confirm("新規デッキを作成しますか？未保存の変更は失われます。")) {
    return;
  }

  deck = [];
  deckNameInput.value = "";
  saveDeck();
  localStorage.setItem("loveca-deck-name", "");
  renderDeck();
});

document.getElementById("load-named-deck").addEventListener("click", () => {
  const name = document.getElementById("saved-decks").value;
  const decks = getNamedDecks();

  if (!name || !decks[name]) {
    alert("保存したデッキを選択してください");
    return;
  }

  deck = structuredClone(decks[name]);
  deckNameInput.value = name;
  saveDeck();
  localStorage.setItem("loveca-deck-name", name);
  renderDeck();
});
document.getElementById("delete-named-deck").addEventListener("click", () => {
  const select = document.getElementById("saved-decks");
  const name = select.value;
  const decks = getNamedDecks();

  if (!name || !Object.prototype.hasOwnProperty.call(decks, name)) {
    alert("削除するデッキを選択してください");
    return;
  }

  if (!confirm(`「${name}」を削除しますか？`)) {
    return;
  }

  delete decks[name];
  localStorage.setItem("loveca-named-decks", JSON.stringify(decks));
  refreshSavedDecks();
  select.value = "";
  alert(`「${name}」を削除しました`);
});
refreshSavedDecks();

deckNameInput.addEventListener("input", () => {
  localStorage.setItem(
    "loveca-deck-name",
    deckNameInput.value
  );
});

document.getElementById("duplicate-deck").addEventListener("click", () => {
  const originalName = deckNameInput.value.trim();

  if (!originalName) {
    alert("先にデッキ名を入力してください");
    return;
  }

  const decks = getNamedDecks();
  const newName = prompt("複製先のデッキ名", originalName + " コピー");

  if (newName === null) return;

  const name = newName.trim();

  if (!name) {
    alert("デッキ名を入力してください");
    return;
  }

  if (Object.prototype.hasOwnProperty.call(decks, name)) {
    alert("同じ名前のデッキが既にあります");
    return;
  }

  decks[name] = structuredClone(deck);
  localStorage.setItem("loveca-named-decks", JSON.stringify(decks));

  deckNameInput.value = name;
  localStorage.setItem("loveca-deck-name", name);

  refreshSavedDecks();
  document.getElementById("saved-decks").value = name;

  alert("デッキを複製しました");
});

    loadCards();
  </script>
</body>
</html>
